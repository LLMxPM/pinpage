# 功能：构建并签名 Windows 升级包，在 GitHub 草稿附件完整后发布正式 Release。
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签，例如 v0.2.0（需已存在）
        required: true
        type: string

permissions:
  contents: write

# 不同版本也串行发布，防止旧版补发覆盖 Latest 指向。
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验版本与发布逻辑
        shell: pwsh
        run: |
          pnpm version:check $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: 检查签名配置
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw '缺少 updater 私钥 Secret，停止发布' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw '缺少 updater 私钥密码 Secret，停止发布' }

      - name: 构建并签名安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: 验证安装包签名与版本绑定
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/nsis/PinPage_$($env:VERSION)_x64-setup.exe"
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify-update -- $installer.FullName

      - name: 手动补发时加载本次工作流版本的发布脚本
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags origin $env:RELEASE_TOOLING_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publisher = git show "$($env:RELEASE_TOOLING_SHA):scripts/release/publish.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = Join-Path $PWD 'scripts/release/publish.mjs'
          [System.IO.File]::WriteAllText($path, ($publisher -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: 准备 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs prepare

      - name: 生成升级清单和校验文件
        run: node scripts/release/artifacts.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pinpage-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/PinPage_${{ env.VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/PinPage_${{ env.VERSION }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/PinPage_${{ env.VERSION }}_x64-setup.exe.sha256
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: 校验附件并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs publish
