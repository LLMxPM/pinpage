# 功能：校验前端与 Windows / macOS 原生代码，并提供默认与实验拖动的 macOS 验证包。

name: CI

on:
  push:
    branches: [main, 'feature/macos-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查格式
        run: pnpm format:check

      - name: 检查版本与发布逻辑
        run: pnpm version:check && pnpm test:release

      - name: 检查文案
        run: pnpm check:i18n

      - name: 检查类型
        run: pnpm check

      - name: 测试 UI 逻辑
        run: pnpm test:ui

      - name: 构建前端
        run: pnpm build

  rust:
    name: Rust 检查与测试 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            features: ''
          - name: macos-default
            os: macos-latest
            features: ''
          - name: macos-option
            os: macos-latest
            features: --features experimental-macos-drag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端资源
        run: pnpm build

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust 静态检查
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets ${{ matrix.features }} -- -D clippy::all

      - name: 运行 Rust 测试
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml ${{ matrix.features }}

      - name: 构建 macOS 独立验证应用
        if: runner.os == 'macOS'
        run: pnpm tauri build --debug --bundles app --config src-tauri/tauri.verification.conf.json ${{ matrix.features }}

      - name: 归档 macOS 应用与构建信息
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/macos-verify
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/debug/bundle/macos/PinPage.app \
            tmp/macos-verify/PinPage-${{ matrix.name }}.zip
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            printf 'variant=%s\nidentifier=com.pinpage.verification\nbuild=debug\nsigning=ad-hoc\n' '${{ matrix.name }}'
          } > tmp/macos-verify/build-info.txt

      - name: 上传 macOS 验证包
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pinpage-${{ matrix.name }}-${{ github.sha }}
          path: tmp/macos-verify/*
          if-no-files-found: error
          retention-days: 14
