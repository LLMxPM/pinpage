# 功能：声明 PinPage 桌面应用及系统集成依赖。
[package]
name = "pinpage"
version = "0.2.0"
description = "将计时器、看板和本地工具页固定在桌面上方"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "pinpage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# macOS 原生拖动待社区实机验收，默认构建不开放该能力。
experimental-macos-drag = ["dep:block2", "dep:objc2", "dep:objc2-app-kit"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.14.1"
semver = "1.0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "NSEvent", "NSResponder", "NSWindow"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
