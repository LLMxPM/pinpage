# 功能：随 PinPage 分发的短生命周期控制台入口和桌面采集器。
[package]
name = "pinpage-cli"
version = "0.2.0"
edition = "2021"

[dependencies]
pinpage-protocol = { path = "../pinpage-protocol" }
pinpage-skills = { path = "../pinpage-skills" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Security"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Security"] }
