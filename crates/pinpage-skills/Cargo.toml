# 功能：独立于运行实例的公开 skill 安装、更新及导出模块。
[package]
name = "pinpage-skills"
version = "0.2.0"
edition = "2021"

[dependencies]
pinpage-protocol = { path = "../pinpage-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
